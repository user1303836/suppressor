name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  ci:
    name: Gates (tests, builds, validation)
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: suppressor-dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
